<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lobby</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #282c34;
      color: white;
      text-align: center;
    }

    #lobby {
      text-align: center;
    }

    #countdown {
      font-size: 30px;
      margin-top: 20px;
      color: white;
      display: none;
    }
  </style>
</head>

<body>
  <div>
    <div id="lobby">
      <h1>En attente de joueurs...</h1>
    </div>
    <div id="countdown">5s</div>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    const lobbyDiv = document.getElementById('lobby');
    const countdownDiv = document.getElementById('countdown');

    socket.on('lobbyUpdate', (lobby) => {
      lobbyDiv.innerHTML = `<h1>Joueurs connectés: ${lobby.length}/2</h1>`;
      if (lobby.length < 2) {
        countdownDiv.style.display = 'none';
        countdownDiv.innerHTML = '5s';
      }
    });

    socket.on('countdown', (countdown) => {
      countdownDiv.style.display = 'block';
      countdownDiv.innerHTML = countdown + 's';
    });

    socket.on('startGame', () => {
      window.location.href = 'jeu.html';
    });

    socket.on('lobbyFull', () => {
      alert('Le lobby est plein. Veuillez réessayer plus tard.');
    });
  </script>
</body>

</html>
